# Builds an unsigned .ipa on a GitHub macOS runner.
# Download it from the run's Artifacts, then sign + install from Windows with Sideloadly/AltStore.
name: Build iOS (unsigned ipa)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter test
      - run: flutter build ios --release --no-codesign

      - name: Package ipa
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          cp -R Runner.app Payload/
          zip -qr voice_chat_app.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: voice_chat_app-ipa
          path: build/ios/iphoneos/voice_chat_app.ipa
          retention-days: 30

name: voice_chat_app
description: English conversation sentences read aloud.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_tts: ^4.2.0
  http: ^1.2.2
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true


flutter_launcher_icons:
  image_path: assets/icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#F6F5F4"
  adaptive_icon_foreground: assets/icon.png
